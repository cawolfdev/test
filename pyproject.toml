[project]
name = "wolf-camera-orbit"
version = "0.1.0"
description = "Reproducible preservation-first camera-orbit view extraction and validation"
requires-python = ">=3.10"
dependencies = ["Pillow>=9", "numpy>=1.20", "matplotlib>=3.5"]

[project.scripts]
wolf-orbit = "wolf_orbit.cli:main"

[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
