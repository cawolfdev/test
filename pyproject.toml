[project]
name = "wildlife-bodybuilder"
version = "0.3.0"
description = "Single-state wildlife bodybuilder camera orbit with geometry-backed guidance"
requires-python = ">=3.10"
dependencies = ["Pillow>=9", "numpy>=1.20", "trimesh>=4"]

[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
